name: KiCad test build (Linux x64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      KICAD_UPSTREAM_TAG: '10.0.8'
      KICAD_UPSTREAM_COMMIT: e432beac2668303194ba2040274f9e5efe773fc0
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the selected fork revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify the KiCad source
        run: |
          source_dir="$GITHUB_WORKSPACE"
          expected="$GITHUB_SHA"
          origin='selected repository revision'
          if [[ ! -f "$source_dir/CMakeLists.txt" ]]; then
            source_dir="$RUNNER_TEMP/kicad-src"
            git clone --depth 1 --single-branch --branch "$KICAD_UPSTREAM_TAG" \
              https://github.com/KiCad/kicad-source-mirror.git "$source_dir"
            expected="$KICAD_UPSTREAM_COMMIT"
            origin="upstream KiCad $KICAD_UPSTREAM_TAG"
          fi
          actual="$(git -C "$source_dir" rev-parse HEAD)"
          if [[ "$actual" != "$expected" || ! -f "$source_dir/CMakeLists.txt" ]]; then
            echo "KiCad source verification failed for $origin." >&2
            exit 1
          fi
          patch="$GITHUB_WORKSPACE/patches/kicad-routing-preview.patch"
          if [[ -f "$patch" ]]; then
            git -C "$source_dir" apply --check "$patch"
            git -C "$source_dir" apply "$patch"
            echo 'Source patch: patches/kicad-routing-preview.patch' >> "$GITHUB_STEP_SUMMARY"
          fi
          if grep -qF 'GetRoutingPreview()' "$source_dir/pcbnew/python/scripting/pcbnew_scripting_helpers.h"; then
            echo 'KICAD_EXPECT_ROUTER_PREVIEW=1' >> "$GITHUB_ENV"
          fi
          printf 'KICAD_SOURCE_DIR=%s\nKICAD_SOURCE_SHA=%s\n' "$source_dir" "$actual" >> "$GITHUB_ENV"
          printf 'Source: %s (%s)\n' "$origin" "$actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Ubuntu build dependencies
        run: |
          sudo add-apt-repository --yes --enable-source ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get build-dep --assume-yes kicad
          sudo apt-get install --assume-yes --no-install-recommends cmake ninja-build \
            python3-wxgtk4.0 swig xvfb xauth

      - name: Configure and build KiCad
        run: |
          cmake -S "$KICAD_SOURCE_DIR" -B "$RUNNER_TEMP/kicad-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/kicad-xsignal-test \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DPYTHON_EXECUTABLE=/usr/bin/python3 \
            -DKICAD_SCRIPTING_WXPYTHON=ON \
            -DKICAD_BUILD_QA_TESTS=OFF \
            -DKICAD_USE_SENTRY=OFF
          cmake --build "$RUNNER_TEMP/kicad-build" --parallel 2

      - name: Stage and verify the test build
        run: |
          stage="$RUNNER_TEMP/kicad-stage"
          prefix="$stage/opt/kicad-xsignal-test"
          DESTDIR="$stage" cmake --install "$RUNNER_TEMP/kicad-build"
          export LD_LIBRARY_PATH="$prefix/lib"
          export KICAD_CONFIG_HOME="$RUNNER_TEMP/kicad-smoke-config"
          "$prefix/bin/kicad-cli" version
          bindings="$(find "$prefix" -type f -name pcbnew.py -print -quit)"
          test -n "$bindings"
          PYTHONPATH="$(dirname "$bindings")" xvfb-run -a /usr/bin/python3 \
            -c 'import os, pcbnew, wx; print(pcbnew.Version()); print(wx.version()); assert not os.getenv("KICAD_EXPECT_ROUTER_PREVIEW") or callable(getattr(pcbnew, "GetRoutingPreview", None))'

      - name: Package the Linux files
        run: |
          mkdir -p dist
          tar -C "$RUNNER_TEMP/kicad-stage/opt" \
            -czf "dist/kicad-xsignal-test-ubuntu24.04-x86_64-$KICAD_SOURCE_SHA.tar.gz" kicad-xsignal-test
          {
            echo 'Ubuntu 24.04 x86-64. The archive stages an installation under /opt/kicad-xsignal-test.'
            echo 'Runtime dependencies and standard libraries are supplied by the KiCad 10.0 Ubuntu packages.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kicad-xsignal-test-ubuntu24.04-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
