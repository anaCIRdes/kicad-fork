name: KiCad test build (Windows x64)

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Windows x64 runner label (or a larger runner)
        type: string
        default: windows-2022
        required: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    env:
      WIN_BUILDER_COMMIT: ec74a8021d7981bd4dcd032f6693a3a3ba414f41
      KICAD_UPSTREAM_TAG: '10.0.8'
      KICAD_UPSTREAM_COMMIT: e432beac2668303194ba2040274f9e5efe773fc0
      KICAD_BUILD_CONFIG: kicad-10.0.8
      VCPKG_BINARY_SOURCES: default;nuget,https://gitlab.com/api/v4/projects/27426693/packages/nuget/index.json,read
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'

    steps:
      - name: Check out the selected fork revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stage the official Windows builder and the fork source
        run: |
          $builder = Join-Path $env:RUNNER_TEMP 'kb'
          git init $builder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $builder fetch --depth=1 https://gitlab.com/kicad/packaging/kicad-win-builder.git $env:WIN_BUILDER_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $builder checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $source = Join-Path $builder '.build/kicad'
          New-Item -ItemType Directory -Force -Path (Split-Path $source) | Out-Null
          if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'CMakeLists.txt')) {
            git clone --no-hardlinks --no-checkout $env:GITHUB_WORKSPACE $source
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C $source checkout --detach $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $expected = $env:GITHUB_SHA
            $origin = 'selected repository revision'
          } else {
            git clone --depth 1 --single-branch --branch $env:KICAD_UPSTREAM_TAG https://github.com/KiCad/kicad-source-mirror.git $source
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $expected = $env:KICAD_UPSTREAM_COMMIT
            $origin = "upstream KiCad $env:KICAD_UPSTREAM_TAG"
          }

          $actual = git -C $source rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -ne $expected -or !(Test-Path -LiteralPath (Join-Path $source 'CMakeLists.txt'))) {
            throw "KiCad source verification failed for $origin."
          }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'patches/kicad-routing-preview.patch'
          if (Test-Path -LiteralPath $patch) {
            git -C $source apply --check $patch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C $source apply $patch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "Source patch: patches/kicad-routing-preview.patch" >> $env:GITHUB_STEP_SUMMARY
          }
          $header = Join-Path $source 'pcbnew/python/scripting/pcbnew_scripting_helpers.h'
          if (Select-String -LiteralPath $header -SimpleMatch 'GetRoutingPreview()' -Quiet) {
            'KICAD_EXPECT_ROUTER_PREVIEW=1' >> $env:GITHUB_ENV
          }
          "KICAD_SOURCE_SHA=$actual" >> $env:GITHUB_ENV
          "Source: $origin ($actual)" >> $env:GITHUB_STEP_SUMMARY

      - name: Configure and build KiCad with Visual Studio
        # KiBuild's System.Drawing helper uses the Windows PowerShell .NET Framework runtime.
        shell: powershell
        run: |
          $builder = Join-Path $env:RUNNER_TEMP 'kb'
          $driver = Join-Path $builder 'build.ps1'
          & $driver -Env -Arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $driver -Vcpkg -Arch x64 -BuildConfigName $env:KICAD_BUILD_CONFIG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The pinned builder initializes vcpkg with UseMsvcCmake=False.
          # Keep the same CMake selection when its packaging step starts a fresh shell.
          $vcpkg = Join-Path $builder 'vcpkg'
          & $driver -Config -VcpkgPath $vcpkg -UseMsvcCmake $true
          $settings = Get-Content -LiteralPath (Join-Path $builder 'settings.json') -Raw | ConvertFrom-Json
          if ($settings.UseMsvcCmake -ne $true) { throw 'Could not persist UseMsvcCmake=true.' }

          $source = Join-Path $builder '.build/kicad'
          $build = Join-Path $source 'build/x64-windows-Release'
          $prefix = Join-Path $builder '.out/x64-windows-Release'
          $toolchain = Join-Path $builder 'vcpkg/scripts/buildsystems/vcpkg.cmake'
          $swig = Join-Path $builder '.support/swigwin-4.3.1/swig.exe'
          $triplets = Join-Path $source 'tools/custom_vcpkg_triplets'
          $flags = @(
            '-S', $source, '-B', $build, '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_MAKE_PROGRAM=$env:NINJA_PATH",
            "-DCMAKE_INSTALL_PREFIX=$prefix",
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
            "-DSWIG_EXECUTABLE=$swig",
            "-DVCPKG_OVERLAY_TRIPLETS=$triplets",
            '-DVCPKG_TARGET_TRIPLET=x64-windows',
            '-DVCPKG_INSTALL_OPTIONS=--x-abi-tools-use-exact-versions',
            '-DKICAD_BUILD_QA_TESTS=OFF',
            '-DKICAD_BUILD_I18N=ON',
            '-DKICAD_WIN32_DPI_AWARE=ON',
            '-DKICAD_SCRIPTING_WXPYTHON=ON',
            '-DKICAD_USE_SENTRY=OFF'
          )
          cmake @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Check the actual install tree before preparing the portable runtime.
          cmake --install $build --prefix $prefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath (Join-Path $prefix 'bin/kicad-cli.exe'))) {
            throw "CMake did not install kicad-cli.exe into $prefix/bin."
          }

      - name: Package the lite runtime and verify it
        shell: powershell
        run: |
          $builder = Join-Path $env:RUNNER_TEMP 'kb'
          $driver = Join-Path $builder 'build.ps1'
          $settings = Get-Content -LiteralPath (Join-Path $builder 'settings.json') -Raw | ConvertFrom-Json
          if ($settings.UseMsvcCmake -ne $true) { throw 'Packaging requires the same Visual Studio CMake as the build.' }
          & $driver -PreparePackage -Arch x64 -BuildConfigName $env:KICAD_BUILD_CONFIG -Lite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = Join-Path $builder '.out/x64-windows-Release'
          $bin = Join-Path $prefix 'bin'
          $env:KICAD_CONFIG_HOME = Join-Path $env:RUNNER_TEMP 'kicad-smoke-config'
          & (Join-Path $bin 'kicad-cli.exe') version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Windows PowerShell 5.1 strips embedded double quotes in native -c arguments.
          $smokeTest = @'
          import os
          import pcbnew
          import wx

          print(pcbnew.Version())
          print(wx.version())
          if os.getenv("KICAD_EXPECT_ROUTER_PREVIEW"):
              if not callable(getattr(pcbnew, "GetRoutingPreview", None)):
                  raise SystemExit("Expected pcbnew.GetRoutingPreview() in the packaged build")
              print("Verified pcbnew.GetRoutingPreview()")
          '@
          $smokeTest | & (Join-Path $bin 'python.exe') -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $dist = New-Item -ItemType Directory -Path 'dist' -Force
          $zip = Join-Path $dist.FullName "kicad-xsignal-test-windows-x64-$env:KICAD_SOURCE_SHA.zip"
          Compress-Archive -Path (Join-Path $prefix '*') -DestinationPath $zip
          'Windows x64 portable lite build. Standard symbol, footprint and 3D libraries are separate.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload the test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kicad-xsignal-test-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
